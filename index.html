<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Per Martina ❤️</title>

<style>
body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(135deg, #ff758c, #ff7eb3);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    overflow: hidden;
    text-align: center;
    color: white;
}

.container {
    position: relative;
}

h1 {
    font-size: 38px;
    margin-bottom: 10px;
}

p {
    font-size: 18px;
}

img {
    width: 200px;
    border-radius: 20px;
    margin: 20px 0;
    box-shadow: 0 0 20px rgba(0,0,0,0.3);
}

button {
    padding: 15px 30px;
    font-size: 18px;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    margin: 10px;
    position: relative;
}

#yes {
    background-color: #ff2e63;
    color: white;
}

#no {
    background-color: white;
    color: #ff2e63;
    position: absolute;
}

.heart {
    position: absolute;
    font-size: 20px;
    animation: float 3s linear infinite;
}

@keyframes float {
    0% { transform: translateY(0); opacity: 1; }
    100% { transform: translateY(-200px); opacity: 0; }
}
</style>
</head>

<body>

<div class="container">
    <h1>Martina 💖</h1>
    <p>Dal 25/01/2025 la mia vita è cambiata...</p>
    <p>Ogni giorno con te è speciale.</p>
    <h2>Vuoi essere la mia Valentina? 💌</h2>

    <!-- FOTO -->
    <img src="foto.jpg" alt="Noi">

    <div>
        <button id="yes">Sì 💖</button>
        <button id="no">No 😈</button>
    </div>
</div>

<!-- MUSICA -->
<audio id="music" src="musica.mp3"></audio>

<script>
const noButton = document.getElementById("no");
const yesButton = document.getElementById("yes");
const music = document.getElementById("music");


// MUSICA parte al primo movimento del mouse
document.body.addEventListener("click", () => {
    music.play();
}, { once: true });


// NO si muove continuamente
function moveButton() {
    const x = Math.random() * (window.innerWidth - 100);
    const y = Math.random() * (window.innerHeight - 50);
    noButton.style.left = x + "px";
    noButton.style.top = y + "px";
}

setInterval(moveButton, 700);


// SÌ fa esplodere cuori
yesButton.addEventListener("click", () => {
    for (let i = 0; i < 60; i++) {
        let heart = document.createElement("div");
        heart.innerHTML = "💖";
        heart.classList.add("heart");
        heart.style.left = Math.random() * window.innerWidth + "px";
        heart.style.top = Math.random() * window.innerHeight + "px";
        document.body.appendChild(heart);

        setTimeout(() => {
            heart.remove();
        }, 3000);
    }
});
</script>

</body>
</html>
